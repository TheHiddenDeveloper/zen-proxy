# deepseek-harness (https://github.com/deepseek-ai/deepseek-harness)
# Merge into $DSH_HOME/settings.yaml (default: ~/.dsh/settings.yaml). Start `zen-proxy` first.
#
# Why the proxy: the harness's LLM layer (pi-ai) always sends an Authorization header, and Zen's
# free endpoint answers 401 "Invalid API key" to any key that isn't a real one. The proxy strips
# the placeholder and also rewrites the `developer` role / `max_completion_tokens` pi-ai sends,
# both of which Zen rejects.
#
# `x-preview-f-free` (Ox Alpha) rotated out of Zen's lineup; the models below are the `*-free`
# set Zen serves today (GET /v1/models lists them). They are declared without `reasoningEfforts`
# because only some free models accept `reasoning_effort`. Swap `agent-default-model` to any id
# listed here, or pick one in Settings → Models.
agent-default-model:
  provider: opencode
  model: big-pickle
llm-pi-ai:
  providers:
    opencode:
      displayName: Opencode Zen (free, via zen-proxy)
      api: openai-completions
      baseURL: http://127.0.0.1:4040/v1
      headers:
        Authorization: Bearer zen-proxy-placeholder
      defaultContextWindow: 200000
      defaultMaxTokens: 32000
      compat:
        supportsDeveloperRole: false
        maxTokensField: max_tokens
        supportsStore: false
      models:
        - id: big-pickle
          name: Big Pickle
          contextWindow: 200000
          maxTokens: 32000
        - id: jev-1.13-free
          name: JEV 1.13 Free
          contextWindow: 200000
          maxTokens: 32000
        - id: deepseek-v4-flash-free
          name: DeepSeek V4 Flash Free
          contextWindow: 200000
          maxTokens: 32000
        - id: muse-spark-1.3-contributor-free
          name: Muse Spark 1.3 Contributor Free
          contextWindow: 200000
          maxTokens: 32000
        - id: muse-spark-1.2-contributor-free
          name: Muse Spark 1.2 Contributor Free
          contextWindow: 200000
          maxTokens: 32000
        - id: mimo-v2.5-free
          name: Mimo V2.5 Free
          contextWindow: 200000
          maxTokens: 32000
        - id: ling-3.0-flash-fin-free
          name: Ling 3.0 Flash Fin Free
          contextWindow: 200000
          maxTokens: 32000
        - id: nemotron-3-ultra-free
          name: Nemotron 3 Ultra Free
          contextWindow: 200000
          maxTokens: 32000
        - id: nemotron-3.5-lightning-free
          name: Nemotron 3.5 Lightning Free
          contextWindow: 200000
          maxTokens: 32000
    # Claude Pro/Max subscription, served by zen-proxy's Anthropic passthrough. Requires plain
    # `claude` to be signed in (~/.claude/.credentials.json); zen-proxy refreshes that session.
    # pi-ai appends /v1/messages to baseURL, so baseURL must NOT include /v1.
    claude:
      displayName: Claude Pro (via zen-proxy)
      api: anthropic-messages
      baseURL: http://127.0.0.1:4040
      headers:
        Authorization: Bearer zen-proxy-placeholder
      defaultContextWindow: 1000000
      defaultMaxTokens: 128000
      models:
        - id: claude-opus-5-5
          name: Claude Opus 5.5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-sonnet-5-5
          name: Claude Sonnet 5.5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-haiku-5-5
          name: Claude Haiku 5.5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-fable-5-1
          name: Claude Fable 5.1
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-opus-5
          name: Claude Opus 5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-sonnet-5
          name: Claude Sonnet 5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-fable-5
          name: Claude Fable 5
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-opus-4-8
          name: Claude Opus 4.8
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-opus-4-7
          name: Claude Opus 4.7
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-sonnet-4-6
          name: Claude Sonnet 4.6
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-opus-4-6
          name: Claude Opus 4.6
          contextWindow: 1000000
          maxTokens: 128000
        - id: claude-opus-4-5-20251101
          name: Claude Opus 4.5
          contextWindow: 200000
          maxTokens: 64000
        - id: claude-haiku-4-5-20251001
          name: Claude Haiku 4.5
